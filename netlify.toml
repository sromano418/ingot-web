[build]
  command = "python3 build.py"
  publish = "_site"

# El panel /admin no debe aparecer en Google
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# 404.html está en la raíz de publicación: Netlify lo sirve con estado 404
# en las direcciones que no existen. noindex también en el HTML.
[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex"

# El blog se llamaba "contenido": las direcciones viejas llevan a /blog
[[redirects]]
  from = "/contenido/*"
  to = "/blog/:splat"
  status = 301
