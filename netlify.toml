[build]
  command = "python3 build.py"
  publish = "_site"

# El panel /admin no debe aparecer en Google
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

# El blog se llamaba "contenido": las direcciones viejas llevan a /blog
[[redirects]]
  from = "/contenido/*"
  to = "/blog/:splat"
  status = 301
